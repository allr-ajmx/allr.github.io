name: Deploy Firestore rules

# The rules in firebase/firestore.rules are the only thing standing between the
# public API key and the waitlist. They used to be pasted into the console by
# hand, which meant a new collection could sit refused for as long as nobody
# remembered. Now the file in this repo is the deployed rule set.

on:
  push:
    branches: [main]
    paths:
      - "firebase/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for credentials
        id: creds
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set — skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # A service account, not `firebase login:ci` — the CI token is deprecated.
      # Grant it "Firebase Rules Admin" on the project.
      - name: Write service account key
        if: steps.creds.outputs.ready == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"

      - name: Deploy rules
        if: steps.creds.outputs.ready == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules \
            --project "$PROJECT_ID" \
            --non-interactive

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json"
